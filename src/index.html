<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sefer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="bg"></div>
  <div id="scrim"></div>

  <main id="stage">
    <div id="verse" aria-live="polite"></div>
    <div id="ref"><span id="refText"></span></div>
  </main>

  <button id="gear" aria-label="Settings" title="Settings">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3.2"/>
      <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15z"/>
    </svg>
  </button>

  <aside id="panel" aria-hidden="true">
    <header>
      <h2>Settings</h2>
      <button id="close" aria-label="Close settings">✕</button>
    </header>

    <div class="body">


      <section>
        <h3>Theme</h3>
        <div id="themes" class="row"></div>
      </section>

      <section>
        <h3>Background</h3>
        <div id="bgs" class="grid"></div>
        <div class="row gap">
          <button id="pickImage" class="btn">Choose image…</button>
          <button id="clearBg" class="btn ghost">Use theme</button>
        </div>
        <input id="imageFile" type="file" accept="image/*" hidden />
        <label class="slider">Dim <input id="dim" type="range" min="0" max="85" step="1" /></label>
        <p id="bgMsg" class="note"></p>
      </section>

      <section>
        <h3>Font</h3>
        <div id="fonts" class="stack"></div>
        <label class="check"><input id="autofit" type="checkbox" /> Fill the screen (auto-size)</label>
        <label class="slider" id="sizeRow">Size <input id="size" type="range" min="18" max="140" step="1" /></label>
      </section>
      <section>
        <h3>Translation</h3>
        <select id="translation"></select>
      </section>
      <section>
        <h3>Go to verse</h3>
        <div class="row gap">
          <select id="goBook"></select>
          <select id="goChapter" class="narrow"></select>
          <select id="goVerse" class="narrow"></select>
        </div>
        <button id="go" class="btn full">Go</button>
      </section>

      <section>
        <h3>History <small id="histCount"></small></h3>
        <ol id="history"></ol>
        <button id="clearHist" class="btn ghost">Clear history</button>
      </section>

      <p class="note keys">← previous verse &nbsp;·&nbsp; → next verse</p>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
