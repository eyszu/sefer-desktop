[package]
name = "sefer-viewer"
version = "0.1.0"
description = "Verse-by-verse viewer for the American Standard Version (1901)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
